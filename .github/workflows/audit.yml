name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    # Every tool here is pinned, so a scheduled rerun of unchanged code adds nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/test_audit_public.py
      - run: python3 scripts/audit_public.py
      - run: python3 scripts/test_package_chatgpt.py
      - run: python3 scripts/test_audit_package.py
      - run: python3 scripts/audit_package.py
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.0"
          # Update with the version: the linux_x64 line in the release's checksums.txt.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      # Bump deliberately: --strict accepts directory-listing fields only on 2.1.281 or later.
      - run: npm install -g @anthropic-ai/claude-code@2.1.292
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/betteroff

  server:
    # Live endpoint checks run on the schedule so a server outage does not block pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/audit_server.sh
