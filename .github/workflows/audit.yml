name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    # Every tool here is pinned, so a scheduled rerun of unchanged code adds nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/test_audit_public.py
      - run: python3 scripts/audit_public.py
      - run: python3 scripts/test_package_chatgpt.py
      - run: python3 scripts/test_sync_skills.py
      - run: python3 scripts/sync_skills.py --check
      - run: python3 scripts/test_tools_catalog.py
      - run: python3 scripts/tools_catalog.py --check
      - run: python3 scripts/test_audit_package.py
      - run: python3 scripts/audit_package.py
      - run: python3 scripts/test_audit_server.py
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.0"
          # Update with the version: the linux_x64 line in the release's checksums.txt.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      # Bump deliberately and confirm that --strict validation still passes.
      - run: npm install -g @anthropic-ai/claude-code@2.1.292
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/betteroff

  server:
    # Live endpoint checks run on the schedule so a server outage does not block pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/audit_server.sh
      - name: Compare tools.json with the public OpenAPI
        if: ${{ !cancelled() }}
        run: python3 scripts/tools_catalog.py --live
      - name: Open or update an issue for a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled server audit failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The daily server audit failed: $RUN_URL"
          fi
